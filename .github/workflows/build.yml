name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: harness-plugin
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22.19.0'
          - os: ubuntu-latest
            node: '24.x'
          - os: windows-latest
            node: '24.x'
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v6
        with:
          path: harness-plugin
      - name: Checkout compatible DSH source
        uses: actions/checkout@v6
        with:
          repository: deepseek-ai/deepseek-harness
          ref: d347e703908d0406b7a7ef80e3a0e594d86b2215
          path: deepseek-harness
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: |
            harness-plugin/pnpm-lock.yaml
            deepseek-harness/pnpm-lock.yaml
      - name: Prepare compatible DSH packages
        working-directory: deepseek-harness
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:lib
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: Upload npm package
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24.x'
        uses: actions/upload-artifact@v4
        with:
          name: npm-package-${{ github.sha }}
          path: harness-plugin/dist/*.tgz
          if-no-files-found: error
          retention-days: 14
